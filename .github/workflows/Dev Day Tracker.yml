name: Dev Day Tracker

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    # Автоматический запуск каждый день в 09:00 по UTC
    - cron: "0 9 * * *"

jobs:
  log-dev-day:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Development Day
        run: |
          # Устанавливаем дату начала так, чтобы сегодня был 34-й день (25 августа 2026 года)
          START_DATE="2026-08-25"
          CURRENT_DATE=$(date +%Y-%m-%d)
          
          # Переводим даты в секунды (Unix timestamp) для вычисления разницы
          START_TS=$(date -d "$START_DATE" +%s)
          CURRENT_TS=$(date -d "$CURRENT_DATE" +%s)
          
          # Вычисляем количество прошедших дней
          DAYS_DIFF=$(( (CURRENT_TS - START_TS) / 86400 ))
          
          echo "🎮 Проект: Blood on Both Sides"
          echo "📅 Сегодня день разработки: $DAYS_DIFF"
